name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu runner image ships the Android SDK (ANDROID_HOME); add NDK and CMake.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --install "ndk;28.2.13676358" "cmake;3.31.6" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew testDebugUnitTest

      # Signed with the project key when the secrets are set (not on fork PRs); else the debug key.
      - name: Build release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.POLARMOBILE_KEYSTORE_BASE64 }}
          POLARMOBILE_KEYSTORE_PASSWORD: ${{ secrets.POLARMOBILE_KEYSTORE_PASSWORD }}
          POLARMOBILE_KEY_ALIAS: ${{ secrets.POLARMOBILE_KEY_ALIAS }}
          POLARMOBILE_KEY_PASSWORD: ${{ secrets.POLARMOBILE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export POLARMOBILE_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: PolarMobile-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
